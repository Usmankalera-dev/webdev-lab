<svg xmlns="http://www.w3.org/2000/svg" width="920" height="620" viewBox="0 0 920 620" font-family="Arial, Helvetica, sans-serif">
  <rect x="0" y="0" width="920" height="620" fill="#ffffff"/>
  <!-- System boundary -->
  <rect x="220" y="20" width="480" height="580" rx="12" fill="#fffbeb" stroke="#d1d5db" stroke-width="2"/>
  <text x="460" y="50" text-anchor="middle" font-size="16" font-weight="bold" fill="#111827">WebDev Lab System</text>

  <!-- Use cases: left column -->
  <g font-size="13" fill="#111827" text-anchor="middle">
    <ellipse cx="345" cy="100" rx="105" ry="28" fill="#ffffff" stroke="#f59e0b" stroke-width="2"/>
    <text x="345" y="104">View Free Lessons</text>
    <ellipse cx="345" cy="180" rx="105" ry="28" fill="#ffffff" stroke="#f59e0b" stroke-width="2"/>
    <text x="345" y="184">Join Waitlist</text>
    <ellipse cx="345" cy="260" rx="105" ry="28" fill="#ffffff" stroke="#f59e0b" stroke-width="2"/>
    <text x="345" y="264">Enroll &amp; Pay</text>
    <ellipse cx="345" cy="340" rx="105" ry="28" fill="#ffffff" stroke="#f59e0b" stroke-width="2"/>
    <text x="345" y="344">Enter Access Code</text>
    <ellipse cx="345" cy="420" rx="105" ry="28" fill="#ffffff" stroke="#f59e0b" stroke-width="2"/>
    <text x="345" y="424">Take Quiz</text>
    <!-- Use cases: right column -->
    <ellipse cx="575" cy="100" rx="105" ry="28" fill="#ffffff" stroke="#f59e0b" stroke-width="2"/>
    <text x="575" y="104">Use Code Editor</text>
    <ellipse cx="575" cy="180" rx="105" ry="28" fill="#ffffff" stroke="#f59e0b" stroke-width="2"/>
    <text x="575" y="184">Track Progress</text>
    <ellipse cx="575" cy="260" rx="105" ry="28" fill="#ffffff" stroke="#f59e0b" stroke-width="2"/>
    <text x="575" y="264">Download Certificate</text>
    <ellipse cx="575" cy="340" rx="105" ry="28" fill="#ffffff" stroke="#f59e0b" stroke-width="2"/>
    <text x="575" y="344">Verify Payment</text>
    <ellipse cx="575" cy="420" rx="105" ry="28" fill="#ffffff" stroke="#f59e0b" stroke-width="2"/>
    <text x="575" y="424">Issue Access Code</text>
  </g>

  <!-- Association lines -->
  <g stroke="#6b7280" stroke-width="1.5">
    <line x1="112" y1="160" x2="240" y2="105"/>
    <line x1="112" y1="180" x2="240" y2="180"/>
    <line x1="112" y1="200" x2="240" y2="255"/>
    <line x1="112" y1="400" x2="240" y2="340"/>
    <line x1="112" y1="425" x2="240" y2="415"/>
    <line x1="112" y1="410" x2="470" y2="105"/>
    <line x1="112" y1="430" x2="470" y2="180"/>
    <line x1="112" y1="445" x2="470" y2="255"/>
    <line x1="820" y1="290" x2="680" y2="335"/>
    <line x1="820" y1="300" x2="680" y2="415"/>
  </g>

  <!-- Actor: Visitor -->
  <g stroke="#111827" stroke-width="2" fill="none">
    <circle cx="95" cy="150" r="16"/>
    <line x1="95" y1="166" x2="95" y2="220"/>
    <line x1="75" y1="185" x2="115" y2="185"/>
    <line x1="95" y1="220" x2="80" y2="255"/>
    <line x1="95" y1="220" x2="110" y2="255"/>
  </g>
  <text x="95" y="278" text-anchor="middle" font-size="14" font-weight="bold" fill="#111827">Visitor</text>

  <!-- Actor: Enrolled Student -->
  <g stroke="#111827" stroke-width="2" fill="none">
    <circle cx="95" cy="380" r="16"/>
    <line x1="95" y1="396" x2="95" y2="450"/>
    <line x1="75" y1="415" x2="115" y2="415"/>
    <line x1="95" y1="450" x2="80" y2="485"/>
    <line x1="95" y1="450" x2="110" y2="485"/>
  </g>
  <text x="95" y="508" text-anchor="middle" font-size="14" font-weight="bold" fill="#111827">Enrolled Student</text>

  <!-- Actor: Admin -->
  <g stroke="#111827" stroke-width="2" fill="none">
    <circle cx="835" cy="250" r="16"/>
    <line x1="835" y1="266" x2="835" y2="320"/>
    <line x1="815" y1="285" x2="855" y2="285"/>
    <line x1="835" y1="320" x2="820" y2="355"/>
    <line x1="835" y1="320" x2="850" y2="355"/>
  </g>
  <text x="835" y="378" text-anchor="middle" font-size="14" font-weight="bold" fill="#111827">Admin (Usman)</text>

  <text x="460" y="600" text-anchor="middle" font-size="11" fill="#6b7280">WebDev Lab — Use Case Diagram (SRS v1.0, 15 Nov 2026)</text>
</svg>
